<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생산관리 대시보드</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body { background:#f3f4f6; }
.drop-zone { border:2px dashed #9ca3af; transition:.2s; }
.drop-zone.dragover { border-color:#2563eb; background:#eff6ff; }
.kpi-card { transition:.15s; }
.kpi-card:hover { transform:translateY(-2px); box-shadow:0 10px 25px rgba(0,0,0,.08); }
</style>
</head>

<body class="min-h-screen text-gray-800">
<div id="dashboard" class="max-w-7xl mx-auto p-4 md:p-6">

<header class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
  <div>
    <h1 class="text-2xl md:text-3xl font-bold text-gray-900">생산관리 대시보드</h1>
    <p class="text-sm text-gray-500 mt-1">자동차 부품 생산 실적 / 불량 / 생산현황</p>
  </div>
  <button onclick="downloadPDF()" class="no-print bg-gray-900 hover:bg-gray-800 text-white px-5 py-3 rounded-lg font-semibold">
    PDF 다운로드
  </button>
</header>

<section class="no-print bg-white rounded-xl shadow-sm p-5 mb-6">
  <h2 class="font-bold text-lg">Excel 데이터 업로드</h2>
  <p class="text-sm text-gray-500 mb-4">XLSX, XLS, CSV 파일을 드래그&드롭하거나 선택하세요.</p>

  <div id="dropZone" class="drop-zone rounded-xl p-10 text-center cursor-pointer">
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" class="hidden">
    <div class="text-4xl mb-3">📊</div>
    <p class="font-semibold">Excel 파일을 여기에 드래그&드롭</p>
    <p class="text-sm text-gray-400 mt-1">또는 클릭하여 파일 선택</p>
    <button type="button" id="selectFileBtn" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg">
      파일 선택
    </button>
    <p id="fileName" class="text-sm text-blue-600 mt-3 font-medium"></p>
  </div>
</section>

<section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
  <div class="kpi-card bg-white rounded-xl shadow-sm p-5">
    <div class="text-sm text-gray-500">계획량</div>
    <div id="planQty" class="text-3xl font-bold mt-2">0</div>
    <div class="text-xs text-gray-400 mt-1">EA</div>
  </div>
  <div class="kpi-card bg-white rounded-xl shadow-sm p-5">
    <div class="text-sm text-gray-500">실적량</div>
    <div id="actualQty" class="text-3xl font-bold text-blue-600 mt-2">0</div>
    <div class="text-xs text-gray-400 mt-1">EA</div>
  </div>
  <div class="kpi-card bg-white rounded-xl shadow-sm p-5">
    <div class="text-sm text-gray-500">달성률</div>
    <div id="achievementRate" class="text-3xl font-bold text-green-600 mt-2">0%</div>
    <div class="text-xs text-gray-400 mt-1">실적량 ÷ 계획량</div>
  </div>
  <div class="kpi-card bg-white rounded-xl shadow-sm p-5">
    <div class="text-sm text-gray-500">불량률</div>
    <div id="defectRate" class="text-3xl font-bold text-red-600 mt-2">0%</div>
    <div class="text-xs text-gray-400 mt-1">불량수량 ÷ 실적량</div>
  </div>
</section>

<section class="bg-white rounded-xl shadow-sm p-5 mb-6">
  <h2 class="text-lg font-bold">일자별 생산량 추이</h2>
  <p class="text-sm text-gray-500 mb-4">Excel 데이터 기준 일자별 실적량</p>
  <div class="relative h-[350px]"><canvas id="productionChart"></canvas></div>
</section>

<section class="bg-white rounded-xl shadow-sm overflow-hidden">
  <div class="p-5 border-b">
    <h2 class="text-lg font-bold">생산 데이터</h2>
    <p id="rowCount" class="text-sm text-gray-500 mt-1">데이터가 없습니다.</p>
  </div>
  <div class="overflow-x-auto">
    <table class="min-w-full text-sm">
      <thead id="tableHead" class="bg-gray-100"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</section>

</div>

<script>
let rawData = [];
let chart = null;

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");

document.getElementById("selectFileBtn").addEventListener("click", e => {
  e.stopPropagation();
  fileInput.click();
});
dropZone.addEventListener("click", e => {
  if (e.target !== document.getElementById("selectFileBtn")) fileInput.click();
});
fileInput.addEventListener("change", e => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});
dropZone.addEventListener("dragover", e => {
  e.preventDefault();
  dropZone.classList.add("dragover");
});
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", e => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
  document.getElementById("fileName").textContent = "업로드 파일: " + file.name;

  const reader = new FileReader();
  reader.onload = e => {
    try {
      const workbook = XLSX.read(new Uint8Array(e.target.result), {
        type: "array",
        cellDates: true
      });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      rawData = XLSX.utils.sheet_to_json(sheet, { defval:"", raw:true });

      if (!rawData.length) {
        alert("엑셀에 데이터가 없습니다.");
        return;
      }
      updateDashboard();
    } catch (err) {
      console.error(err);
      alert("Excel 파일을 읽는 중 오류가 발생했습니다.");
    }
  };
  reader.readAsArrayBuffer(file);
}

function findColumn(row, candidates) {
  const keys = Object.keys(row);
  for (const candidate of candidates) {
    const normalizedCandidate = String(candidate).replace(/\s/g,"").toLowerCase();
    const found = keys.find(key => {
      const normalizedKey = String(key).replace(/\s/g,"").toLowerCase();
      return normalizedKey === normalizedCandidate || normalizedKey.includes(normalizedCandidate);
    });
    if (found) return found;
  }
  return null;
}

function toNumber(value) {
  if (value === null || value === undefined || value === "") return 0;
  if (typeof value === "number") return value;
  const n = parseFloat(String(value).replace(/,/g,"").replace(/%/g,"").trim());
  return isNaN(n) ? 0 : n;
}

function formatNumber(value) {
  return Number(value).toLocaleString("ko-KR");
}

function formatDate(value) {
  if (value instanceof Date) {
    return value.toLocaleDateString("ko-KR", {
      year:"numeric", month:"2-digit", day:"2-digit"
    });
  }
  return String(value);
}

function updateDashboard() {
  const sample = rawData[0];

  const dateColumn = findColumn(sample, ["일자","날짜","생산일","생산일자","date","day"]);
  const planColumn = findColumn(sample, ["계획량","생산계획","계획","plan","target"]);
  const actualColumn = findColumn(sample, ["실적량","생산량","실적","완성수량","actual","production","qty"]);
  const defectColumn = findColumn(sample, ["불량수량","불량","불량품","defect","defects","ng"]);

  let totalPlan = 0, totalActual = 0, totalDefect = 0;

  rawData.forEach(row => {
    if (planColumn) totalPlan += toNumber(row[planColumn]);
    if (actualColumn) totalActual += toNumber(row[actualColumn]);
    if (defectColumn) totalDefect += toNumber(row[defectColumn]);
  });

  const achievement = totalPlan > 0 ? totalActual / totalPlan * 100 : 0;
  const defectRate = totalActual > 0 ? totalDefect / totalActual * 100 : 0;

  document.getElementById("planQty").textContent = formatNumber(totalPlan);
  document.getElementById("actualQty").textContent = formatNumber(totalActual);
  document.getElementById("achievementRate").textContent = achievement.toFixed(1) + "%";
  document.getElementById("defectRate").textContent = defectRate.toFixed(2) + "%";

  createProductionChart(dateColumn, actualColumn);
  renderTable();
}

function createProductionChart(dateColumn, actualColumn) {
  if (!dateColumn || !actualColumn) return;

  const daily = {};
  rawData.forEach(row => {
    const date = formatDate(row[dateColumn]);
    daily[date] = (daily[date] || 0) + toNumber(row[actualColumn]);
  });

  const labels = Object.keys(daily);
  const values = labels.map(d => daily[d]);

  const ctx = document.getElementById("productionChart").getContext("2d");
  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type:"bar",
    data:{
      labels,
      datasets:[{
        label:"생산량",
        data:values,
        backgroundColor:"rgba(37,99,235,.75)",
        borderColor:"rgba(37,99,235,1)",
        borderWidth:1,
        borderRadius:6
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          callbacks:{
            label: ctx => " 생산량: " + Number(ctx.raw).toLocaleString("ko-KR") + " EA"
          }
        }
      },
      scales:{
        y:{
          beginAtZero:true,
          ticks:{callback:value => Number(value).toLocaleString("ko-KR")}
        },
        x:{grid:{display:false}}
      }
    }
  });
}

function renderTable() {
  const head = document.getElementById("tableHead");
  const body = document.getElementById("tableBody");
  head.innerHTML = "";
  body.innerHTML = "";

  if (!rawData.length) return;

  const columns = Object.keys(rawData[0]);
  const tr = document.createElement("tr");

  columns.forEach(column => {
    const th = document.createElement("th");
    th.className = "px-4 py-3 text-left font-semibold text-gray-700 border-b";
    th.textContent = column;
    tr.appendChild(th);
  });
  head.appendChild(tr);

  rawData.forEach(row => {
    const tr = document.createElement("tr");
    tr.className = "hover:bg-gray-50";

    columns.forEach(column => {
      const td = document.createElement("td");
      td.className = "px-4 py-3 border-b text-gray-700 whitespace-nowrap";
      let value = row[column];
      if (value instanceof Date) value = value.toLocaleDateString("ko-KR");
      td.textContent = value ?? "";
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });

  document.getElementById("rowCount").textContent =
    rawData.length.toLocaleString("ko-KR") + "건";
}

function downloadPDF() {
  if (!rawData.length) {
    alert("먼저 Excel 파일을 업로드해주세요.");
    return;
  }

  const element = document.getElementById("dashboard");

  html2pdf().set({
    margin:8,
    filename:"생산관리_대시보드.pdf",
    image:{type:"jpeg",quality:.95},
    html2canvas:{
      scale:2,
      useCORS:true,
      backgroundColor:"#f3f4f6"
    },
    jsPDF:{
      unit:"mm",
      format:"a4",
      orientation:"landscape"
    },
    pagebreak:{mode:["avoid-all","css","legacy"]}
  }).from(element).save();
}
</script>
</body>
</html>
